# Merge with the EXISTING shared edge Nginx configuration on netcup.
# Do not replace edge's other server blocks or bind any new 80/443 host ports.
# DNS: Cloudflare proxied image.plainmile.com A/AAAA -> existing netcup VPS.
# Origin TLS: ensure the existing certificate covers image.plainmile.com.
# Paste this location into an existing 443 vhost with suitable TLS configuration.
location / {
    proxy_pass http://plainmile-image-tools:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
