server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; worker-src 'self' blob:" always;
  # ORT dynamically imports ESM loaders. nginx 1.30 does not map .mjs
  # to JavaScript by default, and nosniff would block the import.
  location ~ ^/ocr/paddle/wasm/[^/]+\\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }
  location = /healthz { access_log off; default_type text/plain; }
  location /_astro/ { expires 7d; add_header Cache-Control "public, max-age=604800" always; }
  location = /404.html { internal; add_header X-Robots-Tag "noindex" always; }
  error_page 404 /404.html;
  location / {
    # Prevent Cloudflare from injecting third-party Web Analytics/Browser Insights
    # scripts into pages where users handle sensitive screenshots.
    # Cloudflare documents that 'public, no-transform' prevents beacon injection.
    add_header Cache-Control "public, no-transform" always;
    try_files $uri $uri/ $uri/index.html =404;
  }
}
