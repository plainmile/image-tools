services:
  image-tools:
    image: ghcr.io/plainmile/image-tools:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMAGE_TOOLS_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 30s
      timeout: 3s
      retries: 3
