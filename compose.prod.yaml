services:
  image-tools:
    image: ghcr.io/plainmile/image-tools:${IMAGE_TAG:-latest}
    container_name: plainmile-image-tools
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
    external: true
